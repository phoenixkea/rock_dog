<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>rock_dog...BUNNI!</title>

  <script type="module" src="model-viewer.min.js"></script>
  <script nomodule src="model-viewer-legacy.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Monsieur+La+Doulaise&family=Noto+Serif+JP:wght@200..900&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="style.css" />

  <style>
    /* layers */
    model-viewer { position:absolute; z-index:0; }
    #draw-canvas { position:fixed; inset:0; width:100vw; height:100vh; z-index:9990; pointer-events:none; }
    .draw-toolbar { position:fixed; top:16px; right:16px; display:flex; flex-direction:column; gap:10px; z-index:9991; user-select:none; font-family:system-ui,sans-serif; pointer-events:auto; }
    .dropdown { position:relative; display:inline-block; z-index:9991; pointer-events:auto; }

    .dropdown img { width:50px; cursor:pointer; }
    .dropdown-content { display:none; position:absolute; background:#fff; min-width:160px; box-shadow:0 8px 16px rgba(0,0,0,.2); z-index:1; }
    .dropdown-content a { color:#000; padding:12px 16px; text-decoration:none; display:block; }
    .dropdown-content a:hover { background:rgb(255 241 241); }
    .dropdown:hover .dropdown-content,
    .dropdown.open .dropdown-content { display:block; }

    .tool-row { display:flex; gap:8px; justify-content:flex-end; }
    .tool-row2 { display:flex;gap:8px; justify-content:flex-start; }
    .swatch { width:28px; height:28px; border-radius:50%; border:2px solid rgb(254, 217, 217);; box-shadow:0 1px 3px rgb(254, 217, 217); cursor:pointer; }
    .swatch[aria-checked="true"] { outline:3px solid rgb(254, 217, 217); }
    .pill { padding:6px 10px; border-radius:999px; background:#ffffffcc; backdrop-filter:blur(6px); box-shadow:0 2px 8px rgb(254, 217, 217); border:1px solid #0001; font-size:13px; }
    .pill button { background:none; border:none; cursor:pointer; padding:0; margin:0; font:inherit; }
    .size-pill { min-width:84px; text-align:center; }
    #sizeRange { width:160px; }

    /* Name modal size + look */
#nameDialog{
  width: 500px;                 /* <- dialog width */
  max-width: calc(100vw - 40px);
  min-height: 10px;            /* <- dialog height (use min-height) */
  padding: 16px 18px;
  border: 1px rgb(254, 217, 217);;
  border-radius: 12px;
  background: #fff;
  box-shadow: 0 4px 16px rgb(254, 217, 217);
  
}
#nameDialog::backdrop{
  background: rgba(0,0,0,.25);  /* dim behind the modal (optional) */
}

/* tidy layout inside */
#nameForm{ display:grid; gap:12px; font-family:'Times New Roman', Times, serif ;}


:root{
  --ui-font: "Noto Serif JP", serif;        
}

/* dialog-wide default */
#nameDialog, #nameDialog *{
  font-family: var(--ui-font);
}

/* sizes */
#nameInput{
  font-size: 15px;
}
#submitName, #cancelName{
  font-size: 16px;
  font-weight: 600;
  letter-spacing: .2px;
}

/* placeholder style */
#nameInput::placeholder{
  font-family: inherit;
  color: #888;
}

#nameDialog h3{
  font-family: "Monsieur La Doulaise", cursive;
  font-size: 28px;
  margin: 0 0 8px;
  font-style: italic;
}

/* remove the pill’s visual box from the toolbar row */
#nextModelPillSolo { display: contents; }  /* no extra gap/box */

/* float the button bottom-left */
#nextModelBtn {
  position: fixed;
  left: 16px;              /* ← adjust to taste */
  top: 570px;             /* ↑ adjust to taste */
  z-index: 9992;           /* above toolbar (9991) and canvas */
  padding: 10px 14px;
  border-radius: 999px;
  background: #ffffffcc;
  backdrop-filter: blur(6px);
  border: 1px solid #0001;
  box-shadow: 0 2px 8px rgb(254, 217, 217);;
  pointer-events: auto;    /* make sure clicks go through */
  font-family: 'arial', sans-serif;

}

/* show the second pill under “new friend” */
#inspectPillSolo { display: contents; }

#inspectBtn{
  position: fixed;
  left: 16px;          /* align with #nextModelBtn */
  top: 620px;          /* a bit below it (tweak as you like) */
  z-index: 9992;
  padding: 10px 14px;
  border-radius: 999px;
  background: #ffffffcc;
  backdrop-filter: blur(6px);
  border: 1px solid #0001;
  box-shadow: 0 2px 8px rgb(254, 217, 217);
  pointer-events: auto;
  font-family: 'arial', sans-serif;
}
#inspectBtn:hover { box-shadow: 0 4px 14px #0002; }


/* (optional) make the floating button a simple pill look on hover/focus */
#nextModelBtn:hover { box-shadow: 0 4px 14px rgb(254, 217, 217); }
#nextModelBtn:disabled { opacity: .6; cursor: not-allowed; }

model-viewer#mv {
  position: fixed;
  inset: 0;            /* top:0; right:0; bottom:0; left:0 */
  width: 100vw;
  height: 100vh;
  pointer-events: none; /* you already toggle this in JS */
  z-index: 0;
}

  </style>
</head>

<body style="overflow:hidden;">
  <canvas id="draw-canvas"></canvas>

  <div class="draw-toolbar" role="toolbar" aria-label="Drawing tools">
    <div class="tool-row">
      <button class="swatch" data-color="#ff3b30" style="background:#ff3b30" aria-label="Red" aria-checked="false"></button>
      <button class="swatch" data-color="#34c759" style="background:#34c759" aria-label="Green" aria-checked="false"></button>
      <button class="swatch" data-color="#0a84ff" style="background:#0a84ff" aria-label="Blue" aria-checked="false"></button>
      <button class="swatch" data-color="#ffd60a" style="background:#ffd60a" aria-label="Yellow" aria-checked="false"></button>
      <button class="swatch" data-color="#000000" style="background:#000000" aria-label="Black" aria-checked="true"></button>
    </div>

    <div class="tool-row">
      <div class="pill size-pill" id="sizeLabel">size: 8px</div>
      <div class="pill"><button id="clearBtn">clear</button></div>
      <div class="pill"><button id="undoBtn">undo</button></div>
      <div class="pill"><button id="printBtn">print</button></div>
    </div>

    <div class="tool-row">
      <div class="pill" id="nextModelPillSolo">
        <button id="nextModelBtn" data-ui title="Switch 3D model">new friend</button>
      </div>
    </div>
    

    <div class="tool-row">
      <div class="pill" style="padding:10px 12px;">
        <input id="sizeRange" type="range" min="1" max="100" value="8" />
      </div>
    </div>
  </div>

  <div class="pill" id="inspectPillSolo" style="font-family: 'Times New Roman', Times, serif;">
    <button id="inspectBtn" data-ui title="Explore / lock view">explore</button>
  </div>
  
  <model-viewer
    id="mv"
    src="scans/cloud_dog.glb"
    auto-rotate
    alt="rectangle"
    background-color="#455A64"
    ar-status="not-presenting">
  </model-viewer>


  <div class="dropdown">
    <img src="image/dropdown/menu.png" alt="Menu">
    <div class="dropdown-content">
        <a href="index.html"><i>homepage</i></a>
      <a href="page2.html"><i>as i walk to my mums house☆彡</i></a>
      <a href="page5.html"><i>the ocean is where i'm meant to be</i></a>
      <a href="page3.html"><i>little puppy, dance with me</i></a>
      <a href="page6.html"><i>puddles lets find wuddles</i></a>
      <a href="gallery.html">gallery</a>
      <a href="https://open.spotify.com/playlist/1DH13QjjNADStC9eDeh3Pb?si=d0152e58670c45c5">soundtrack☆彡</a>

    </div>
  </div>

  <a href="gallery.html"><img src="image/arrow/arrow2.png"  
    style=" position: absolute; width:62px;height:62px; top: 600px; left: 1220px;"></a>



  <!-- Name modal -->
  <dialog id="nameDialog">
    <form id="nameForm" method="dialog" style="margin:0">
      <input id="nameInput" type="text" required placeholder="say something..." autocomplete="name" autocapitalize="none"
             style="text-transform: lowercase; width:80%; padding:10px 12px; border:1px solid #ddd;border-radius:10px; font-style: italic;" />
      <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:12px">
        <button type="button" id="cancelName" style="padding:8px 12px;border-radius:10px;border:1px  #0001;background:#fff;cursor:pointer; font-family: 'Times New Roman', serif;">Cancel</button>
        <button type="submit" id="submitName" style="padding:8px 12px;border-radius:10px;border:1px  #111;background:#111;color:#fff;cursor:pointer; font-family: 'Times New Roman', serif;">Submit</button>
      </div>
    </form>
  </dialog>

  <script>
  (() => {
    const canvas = document.getElementById('draw-canvas');
    const ctx = canvas.getContext('2d');

    // --- Supabase (lazy) ---
    const SUPABASE_URL = 'https://oksxrkytqclwrzmzvvls.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9rc3hya3l0cWNsd3J6bXp2dmxzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTczNzQ2MzEsImV4cCI6MjA3Mjk1MDYzMX0.0XUz1ZZPKYaV5Y3I88i4R7QDDd4efmnMsLfgnYLXYmc';
    let supabaseClient = null;
    async function getSupabase(){
      if (supabaseClient) return supabaseClient;
      const mod = await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');
      supabaseClient = mod.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      return supabaseClient;
    }

    // --- Undo history ---
    const history = []; const MAX_HISTORY = 50;
    function saveSnapshot(){ try{ history.push(canvas.toDataURL('image/png')); if(history.length>MAX_HISTORY)history.shift(); }catch{} }
    function restoreSnapshot(url){
      if(!url) return;
      const img = new Image();
      img.onload = () => { ctx.save(); ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,canvas.width,canvas.height); ctx.drawImage(img,0,0,canvas.width,canvas.height); ctx.restore(); };
      img.src = url;
    }
    function undo(){ if(history.length<=1) return; history.pop(); restoreSnapshot(history[history.length-1]); }

    // --- HiDPI + resize ---
    function resizeCanvas(){
      const dpr = Math.max(1, window.devicePixelRatio||1);
      const w = innerWidth, h = innerHeight;
      canvas.width = Math.floor(w*dpr); canvas.height = Math.floor(h*dpr);
      canvas.style.width = w+'px'; canvas.style.height = h+'px';
      ctx.setTransform(1,0,0,1,0,0); ctx.scale(dpr,dpr);
      ctx.lineCap='round'; ctx.lineJoin='round';
      history.length = 0; saveSnapshot();
    }

    // --- State/UI ---
    let drawing=false, drawingEnabled=false, lastX=0,lastY=0, color='#000000', size=8;
    const swatches=[...document.querySelectorAll('.swatch')];
    const sizeLabel=document.getElementById('sizeLabel');
    const clearBtn=document.getElementById('clearBtn');
    const undoBtn=document.getElementById('undoBtn');
    const sizeRange=document.getElementById('sizeRange');
    const printBtn=document.getElementById('printBtn');
    const modelViewer=document.getElementById('mv');

    function setColor(hex){ color=hex; swatches.forEach(s=>s.setAttribute('aria-checked', s.dataset.color===hex?'true':'false')); }
    setColor(color);
    swatches.forEach(s=>s.addEventListener('click',()=>{ setColor(s.dataset.color); drawingEnabled=true; }));
    clearBtn.addEventListener('click',()=>{ saveSnapshot(); ctx.save(); ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,canvas.width,canvas.height); ctx.restore(); });
    if (undoBtn) undoBtn.addEventListener('click', undo);
    if (sizeRange) sizeRange.addEventListener('input',()=>updateSize(parseInt(sizeRange.value,10)));
    function updateSize(n){ size=Math.max(1,Math.min(100,Math.round(n))); sizeLabel.textContent=`Size: ${size}px`; if(String(sizeRange.value)!==String(size)) sizeRange.value=String(size); }
    updateSize(size);

    function isInteractive(t){ return !!(t.closest('.draw-toolbar')||t.closest('.dropdown')||t.closest('a,button,input,select,textarea,label,[role="button"]')||t.closest('[data-ui]')); }
    document.addEventListener('click',e=>{ if(e.target.closest('.dropdown a')){ drawingEnabled=false; document.body.style.cursor=''; } });

    function startDraw(x,y){ saveSnapshot(); drawing=true; lastX=x; lastY=y; canvas.style.pointerEvents='auto'; document.body.style.cursor='crosshair'; }
    function drawTo(x,y){ if(!drawing)return; ctx.strokeStyle=color; ctx.lineWidth=size; ctx.beginPath(); ctx.moveTo(lastX,lastY); ctx.lineTo(x,y); ctx.stroke(); lastX=x; lastY=y; }
    function endDraw(){ if(!drawing)return; drawing=false; canvas.style.pointerEvents='none'; document.body.style.cursor=''; }

    document.addEventListener('mousedown', (e) => {
      if (!drawingEnabled) return;
      if (e.button !== 0) return;
      if (isInteractive(e.target)) return;
      e.preventDefault();
      startDraw(e.clientX, e.clientY);
    });
    document.addEventListener('mousemove', (e) => drawTo(e.clientX, e.clientY));
    document.addEventListener('mouseup', endDraw);
    addEventListener('blur', endDraw);
    document.addEventListener('wheel', e => { if(!drawingEnabled||!drawing) return; e.preventDefault(); const d=e.deltaY||e.wheelDelta||0; updateSize(size+(d>0?-2:2)); }, {passive:false});
    document.addEventListener('touchstart', e => { if(!drawingEnabled||isInteractive(e.target)) return; const t=e.touches[0]; startDraw(t.clientX,t.clientY); }, {passive:true});
    document.addEventListener('touchmove',  e => { if(!drawingEnabled) return; const t=e.touches[0]; drawTo(t.clientX,t.clientY); }, {passive:true});
    document.addEventListener('touchend', endDraw);
    document.addEventListener('touchcancel', endDraw);
    document.addEventListener('keydown', e => { if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='z'){ e.preventDefault(); undo(); } });

    // --- LIVE frame grab (no state changes) ---
    async function blitModelViewerFrame(mv, ctx, dpr){
      await new Promise(r => requestAnimationFrame(r)); // read the frame you see
      const list = mv.shadowRoot ? mv.shadowRoot.querySelectorAll('canvas') : null;
      const src  = list && list.length ? list[list.length-1] : null;
      if (!src || !src.width || !src.height) return;
      const rect = mv.getBoundingClientRect();
      ctx.drawImage(src, 0,0,src.width,src.height,
                    Math.round(rect.left*dpr), Math.round(rect.top*dpr),
                    Math.round(rect.width*dpr), Math.round(rect.height*dpr));
    }

    // --- Name prompt + capture/upload ---
    const nameDialog = document.getElementById('nameDialog');
    const nameForm   = document.getElementById('nameForm');
    const nameInput  = document.getElementById('nameInput');
    const cancelName = document.getElementById('cancelName');

    function slugifyName(name){
      return (name || 'anon').trim().replace(/[^a-z0-9\-_ ]/gi,'').replace(/\s+/g,'_').toLowerCase().slice(0,64) || 'anon';
    }

    async function captureAndUpload(caption){
      const dpr = Math.max(1, window.devicePixelRatio||1);
      const out = document.createElement('canvas');
      out.width = Math.floor(innerWidth*dpr);
      out.height = Math.floor(innerHeight*dpr);
      const octx = out.getContext('2d');

      octx.fillStyle='#fff'; octx.fillRect(0,0,out.width,out.height);
      await blitModelViewerFrame(modelViewer, octx, dpr);
      if (canvas && canvas.width && canvas.height) octx.drawImage(canvas, 0, 0);

      out.toBlob(async (blob)=>{
        if(!blob) return;

        const slug = slugifyName(caption);
        // local download
        const a=document.createElement('a');
        a.download=`bunni_doodle_${slug}.png`;
        a.href=URL.createObjectURL(blob);
        a.click();
        URL.revokeObjectURL(a.href);



        // upload image + JSON sidecar
        try{
          const supabase = await getSupabase();
          const ts = Date.now();
          const imgPath = `doodles/${ts}_${slug}.png`;
          const { error } = await supabase.storage.from('gallery').upload(imgPath, blob, { contentType:'image/png' });
          if (error) throw error;

          const meta = { name: caption || 'anon', slug, imagePath: imgPath, createdAt: new Date().toISOString() };
          const metaBlob = new Blob([JSON.stringify(meta, null, 2)], { type:'application/json' });
          await supabase.storage.from('gallery').upload(`doodles/meta/${ts}_${slug}.json`, metaBlob, { contentType:'application/json' });

          console.log('Uploaded with caption:', caption);
        }catch(err){ console.error('Upload failed:', err); }
      }, 'image/png');
    }

    // open/close modal + submit
    printBtn.addEventListener('click', () => { nameDialog.showModal(); setTimeout(()=>nameInput.focus(), 0); });
    cancelName.addEventListener('click', () => nameDialog.close());
    nameForm.addEventListener('submit', async (e) => {
      e.preventDefault();
  const caption = (nameInput.value || '').trim().toLowerCase();  // ⬅️ force lowercase
  nameDialog.close();
  nameForm.reset();
  await captureAndUpload(caption || 'anon');
});

    // mobile dropdown toggle
    const dd = document.querySelector('.dropdown');
    if (dd) {
      const trigger = dd.querySelector('img');
      trigger.addEventListener('click', (e) => { e.stopPropagation(); dd.classList.toggle('open'); });
      document.addEventListener('click', () => dd.classList.remove('open'));
    }


  const nextModelBtn = document.getElementById('nextModelBtn');

// 🔁 list your 3 GLBs here (replace names to match your files)
const MODELS = [
  'scans/cloud_dog.glb',
  'scans/just_dog_1.glb',
  'scans/scan_no_wall.glb'
];

// figure out current index based on the <model-viewer src>
function norm(p){ return new URL(p, location.href).pathname; }
let modelIndex = MODELS.findIndex(m => norm(m) === norm(modelViewer.getAttribute('src')));
if (modelIndex < 0) modelIndex = 0;

// remember last choice between visits (optional)
try {
  const saved = parseInt(localStorage.getItem('bunni:modelIndex'), 10);
  if (!isNaN(saved) && saved >= 0 && saved < MODELS.length) {
    modelIndex = saved;
    if (norm(MODELS[modelIndex]) !== norm(modelViewer.getAttribute('src'))) {
      modelViewer.src = MODELS[modelIndex];
    }
  }
} catch {}

if (MODELS.length < 2 && nextModelBtn) nextModelBtn.style.display = 'none';

// click → cycle to next model
nextModelBtn?.addEventListener('click', async () => {
  modelIndex = (modelIndex + 1) % MODELS.length;
  modelViewer.src = MODELS[modelIndex];

  // brief disable to avoid spam; re-enable when model-viewer is ready
  nextModelBtn.disabled = true;
  try {
    // model-viewer exposes updateComplete as a promise in modern builds
    await (modelViewer.updateComplete ?? new Promise(r => requestAnimationFrame(r)));
  } finally {
    nextModelBtn.disabled = false;
    try { localStorage.setItem('bunni:modelIndex', String(modelIndex)); } catch {}
  }
});

// --- Inspect / lock toggle ---
const inspectBtn = document.getElementById('inspectBtn');
let inspecting = false;

// treat model-viewer as "interactive" target only when inspecting
function isInteractive(t){
  return !!(
    t.closest('.draw-toolbar') ||
    t.closest('.dropdown')     ||
    t.closest('a,button,input,select,textarea,label,[role="button"]') ||
    (inspecting && t.closest('model-viewer')) ||
    t.closest('[data-ui]')
  );
}

function setInspect(on){
  inspecting = on;

  if (on) {
    // let the user orbit/zoom
    modelViewer.setAttribute('camera-controls', '');
    modelViewer.removeAttribute('auto-rotate');
    modelViewer.style.pointerEvents = 'auto';

    // keep drawing from grabbing the mouse
    canvas.style.pointerEvents = 'none';
    document.body.style.cursor = '';
    inspectBtn.textContent = 'lock view';
  } else {
    // go back to non-interactive spinner
    modelViewer.removeAttribute('camera-controls');
    modelViewer.setAttribute('auto-rotate', '');
    modelViewer.style.pointerEvents = 'none';

    inspectBtn.textContent = 'explore';
  }
}

inspectBtn?.addEventListener('click', () => setInspect(!inspecting));

    // ✅ init INSIDE the IIFE (so functions are in scope)
    resizeCanvas();
    addEventListener('resize', resizeCanvas);
  })();

  </script>
</body>
</html>
